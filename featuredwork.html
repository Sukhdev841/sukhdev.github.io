<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A collage of car sticker jobs completed — newest work first." />
  <title>Featured Work</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/site.js" defer></script>
</head>
<body data-page-title="Featured Work">

  <!-- ===== Header ===== -->
  <header>
    <a href="index.html" class="logo">
      <img src="assets/logo.svg" alt="Car stickers logo" class="logo-img" />
      <span class="brand-name" data-brand></span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="designs.html">Designs</a>
      <a href="featuredwork.html" class="active">Featured Work</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <!-- ===== Page Hero ===== -->
  <div class="page-hero">
    <h1>Featured Work</h1>
    <p>A collage of car stickers I've already installed — my latest work shown first.</p>
  </div>

  <!-- ===== Collage ===== -->
  <section>
    <!-- Newest first. Add new images near the top using a YYYY-MM-DD- file name. -->
    <!-- The varied "wide"/"tall" classes create a static collage layout (no shuffle on load). -->
    <div class="collage">
      <figure class="collage-item wide"><img src="featured-work/2026-06-15-mustang-flames.svg" alt="Completed car sticker work" loading="lazy" /></figure>
      <figure class="collage-item"><img src="featured-work/2026-05-28-jeep-trail.svg" alt="Completed car sticker work" loading="lazy" /></figure>
      <figure class="collage-item tall"><img src="featured-work/2026-04-10-bmw-racing.svg" alt="Completed car sticker work" loading="lazy" /></figure>
      <figure class="collage-item"><img src="featured-work/2026-03-02-truck-eagle.svg" alt="Completed car sticker work" loading="lazy" /></figure>
      <figure class="collage-item tall"><img src="featured-work/2026-01-18-civic-tribal.svg" alt="Completed car sticker work" loading="lazy" /></figure>
      <figure class="collage-item wide"><img src="featured-work/2025-12-05-bike-skull.svg" alt="Completed car sticker work" loading="lazy" /></figure>
      <figure class="collage-item"><img src="featured-work/2025-11-20-van-mural.svg" alt="Completed car sticker work" loading="lazy" /></figure>
      <figure class="collage-item"><img src="featured-work/2025-10-08-audi-carbon.svg" alt="Completed car sticker work" loading="lazy" /></figure>
    </div>
  </section>

  <!-- ===== CTA Banner ===== -->
  <div class="cta-banner">
    <h2>Like What You See?</h2>
    <p>Browse my sticker designs and send me the ID of the one you want.</p>
    <a href="designs.html" class="btn btn-primary">Browse Sticker Designs →</a>
  </div>

  <!-- ===== Footer ===== -->
  <footer>
    <p>&copy; <span data-year></span> <span data-brand></span>. &nbsp;|&nbsp;
      <a href="index.html">← Back to Home</a>
    </p>
  </footer>

</body>
</html>
